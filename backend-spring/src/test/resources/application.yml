spring:
  application:
    name: neurograph-backend-test

  # Use H2 in-memory database for isolated, lightning-fast automated tests
  datasource:
    url: jdbc:h2:mem:neurograph_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

neurograph:
  inference:
    base-url: http://localhost:8000/api/v1
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  cors:
    allowed-origins:
      - "http://localhost:3000"

logging:
  level:
    root: INFO
    com.neurograph.backend: DEBUG
